name: Room to Grow integration
on:
  push:
    branches: [build/room-to-grow]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: room-to-grow-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    if: github.ref == 'refs/heads/build/room-to-grow'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Integrate reviewed changes against version 2.0
        shell: bash
        run: |
          if grep -q '"version": "2.0.0"' package.json; then
            python3 tools/room_engine.py
            python3 tools/room_ui.py
          fi
          python3 - <<'PY'
          from pathlib import Path
          p=Path('qol-ui.js');p.write_text(p.read_text().replace('Math.ceil(n-stock(s,k)))','Math.ceil(n-stock(s,k))'))
          p=Path('qol.css');t=p.read_text()
          if 'Short landscape still leaves' not in t:
              t+='''
          /* Short landscape still leaves a usable, scrollable task panel between the bars. */
          @media (max-height: 650px) and (min-width: 741px) {
           .topbar{padding:5px 12px;gap:10px}.brand h1{font-size:23px}.brand small{display:none}.brand canvas{width:30px;height:30px}.resource{padding:4px 9px;min-width:75px}.resource small{font-size:8px}.resource strong{font-size:16px}.iconbutton{height:44px}.topactions{gap:2px}
           #resourceRibbon{display:none}.statusrow{min-height:28px}#statusbar{min-height:28px}.statusrow .timepill{font-size:10px;padding:3px 0}
           .bottombar{padding:0 9px calc(5px + var(--safe-bottom));gap:0}.dock{padding:4px 6px}.workbar{margin-bottom:3px;padding-bottom:3px}.workbar button{padding:6px 12px;min-height:44px}.buildcard{min-height:66px;padding:3px 5px 5px}.buildcard canvas{width:30px;height:27px}.buildcard b{font-size:10px;margin-top:1px}.buildcard small{font-size:9px;margin-top:2px}.hintline{display:none}
           #contextRail{width:285px;top:calc(var(--head-height) + var(--status-height) + 8px);bottom:calc(var(--dock-height) + 8px)}#contextRail>section,#contextRail>aside,#contextRail>.buildhint,#contextRail>.routehint{min-height:0;padding:12px}
           .sidecontrols{top:calc(var(--head-height) + var(--status-height) + 8px);right:9px;flex-direction:row;align-items:flex-start;gap:5px}.controlgroup{flex-direction:row;padding:2px}.controlgroup button{min-height:44px;min-width:40px}.controlgroup .separator{width:1px;height:28px;margin:8px 1px}.bell{padding:10px}.bell span{display:none}
          }
          '''
          p.write_text(t)
          p=Path('tests/browser.mjs');t=p.read_text()
          for a in ['await page.touchscreen.tap(home.x,home.y);','await page.touchscreen.tap(point.x,point.y);']:
              if a+'await page.locator("#confirmBuild").tap();' not in t:t=t.replace(a,a+'await page.locator("#confirmBuild").tap();')
          p.write_text(t)
          p=Path('tests/timber.browser.mjs');t=p.read_text()
          for a in ['await tapTile(20.5,19.5);assert.equal','await tapTile(x+.5,y+.5);assert.equal']:
              t=t.replace(a,a.replace(';assert.equal',';await page.locator("#confirmBuild").tap();assert.equal'))
          for action in ['connect','pause']:
              a=f"await page.locator('[data-action=\"{action}\"]').tap();"
              b="await page.locator('.machineDetails').evaluate(el=>el.open=true);"+a
              if b not in t:t=t.replace(a,b)
          t=t.replace("await page.locator('[data-reserve=\"wood\"]').tap();", "await page.locator('[data-reserve-input=\"wood\"]').fill(\"24\");await page.locator('[data-reserve-input=\"wood\"]').press(\"Tab\");")
          p.write_text(t)
          p=Path('README.md');t=p.read_text()
          if '## Room to Grow' not in t:
              t=t.replace('# Littlefolk\n','# Littlefolk\n\n## Room to Grow · 2.1\n\nPreview and confirm construction, mark forests for autonomous permanent clearing, replant trees, lift paths, move buildings freely, and connect workshop delivery loops in one tap. Context panels now share one measured rail instead of covering each other. Existing villages continue without a reset.\n\nSee **[the Room to Grow guide](ROOM-TO-GROW.md)** for the latest controls and update instructions. This guide takes precedence over the older introductions below.\n',1)
          p.write_text(t)
          PY
      - name: Check JavaScript syntax
        run: npm run check
      - name: Test village, factory and clearing rules
        shell: bash
        run: node --test tests/*.test.mjs | tee unit-results.txt
      - name: Install browser test engines
        run: |
          npm install --no-save --ignore-scripts playwright
          npx playwright install --with-deps chromium webkit
      - name: Original village, saving and offline cache
        run: node tests/browser.mjs
      - name: Factory controls, frame recovery and legacy villages
        run: node tests/timber.browser.mjs
      - name: Intuitive touch controls and layout bounds
        run: node tests/qol.browser.mjs
      - name: Commit tested runtime only
        shell: bash
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js world.js industry.js industry-ui.js index.html sw.js package.json qol-ui.js qol.css tests/ README.md ROOM-TO-GROW.md
          if ! git diff --cached --quiet; then
            git commit -m 'Release tested Littlefolk 2.1: Room to Grow'
            git push origin HEAD:build/room-to-grow
          fi
          git rev-parse HEAD
      - name: Keep source, results and visual checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: room-to-grow-checked-build
          retention-days: 7
          path: |
            *.js
            *.html
            *.css
            *.json
            *.webmanifest
            *.svg
            README.md
            TIMBER.md
            ROOM-TO-GROW.md
            tests/
            tools/room_*.py
            artifacts/
            unit-results.txt
