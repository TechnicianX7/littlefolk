name: Recover Timber & Tinkering
on:
  push:
    branches: [build/timber-tinkering]
    paths: [.github/workflows/recover.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/timber-tinkering
      - name: Complete the interrupted integration
        run: |
          if grep -q 'export const VERSION = 1;' world.js; then
            python3 tools/upgrade_v2.py
            npm run check
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add world.js app.js index.html sw.js package.json .github/workflows/check.yml
            git commit -m 'Integrate recovered industry systems, local-save migration and runtime safeguards'
            git push origin HEAD:build/timber-tinkering
          fi
      - name: Retain the integrated source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: littlefolk-recovered-source
          retention-days: 7
          include-hidden-files: true
          path: |
            *.js
            *.html
            *.css
            *.json
            *.webmanifest
            *.svg
            README.md
            tests/
            tools/
            .github/workflows/
  test:
    needs: integrate
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/timber-tinkering
          persist-credentials: false
      - run: npm run check
      - name: Simulation and migration regression tests
        run: |
          set -o pipefail
          npm test | tee unit-results.txt
      - name: Prepare tablet browser tests
        run: |
          npm install --no-save --ignore-scripts playwright
          npx playwright install --with-deps chromium webkit
      - name: Browser and recovery tests
        run: node tests/browser.mjs && node tests/timber.browser.mjs
      - name: Retain results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: littlefolk-recovered-checks
          retention-days: 7
          path: |
            artifacts/
            unit-results.txt
