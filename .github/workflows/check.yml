name: Village checks
on:
  push:
    branches: [main, release/hearth-harvest-2.2]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: village-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check JavaScript
        run: npm run check
      - name: Test village, industry, land, meals and a complete playthrough
        shell: bash
        run: |
          set -o pipefail
          node --test tests/*.test.mjs | tee unit-results.txt
      - name: Prepare browser tests
        run: |
          npm install --no-save --ignore-scripts playwright
          npx playwright install --with-deps chromium webkit
      - name: Test tablet controls, saves and offline play
        run: node tests/browser.mjs
      - name: Test supply chains, touch recovery and legacy villages
        run: node tests/timber.browser.mjs
      - name: Test intuitive controls, clearing, movement and panel layout
        run: node tests/qol.browser.mjs
      - name: Test food, wishes, building guides, area clearing and 5x play
        run: node tests/bloom.browser.mjs
      - name: Keep source and visual test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: littlefolk-checked-build
          retention-days: 7
          path: |
            index.html
            app.js
            world.js
            industry.js
            industry-ui.js
            industry.css
            qol-ui.js
            qol.css
            bloom.js
            bloom-ui.js
            bloom.css
            sw.js
            manifest.webmanifest
            icon.svg
            package.json
            README.md
            TIMBER.md
            ROOM-TO-GROW.md
            HEARTH-AND-HARVEST.md
            tests/
            artifacts/
            unit-results.txt
